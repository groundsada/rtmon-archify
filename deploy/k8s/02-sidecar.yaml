apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtmon-archify-sidecar
  namespace: mfsada
  labels:
    app: rtmon-archify-sidecar
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rtmon-archify-sidecar
  template:
    metadata:
      labels:
        app: rtmon-archify-sidecar
    spec:
      # The image runs as the node user (uid/gid 1000), and a freshly
      # provisioned PVC is mounted root-owned 755 - so without this the
      # renderer gets EACCES the first time it writes an artifact, while
      # /healthz still answers and the pod still looks Ready. fsGroup has
      # kubelet chown the volume to that group on mount.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: sidecar
          image: ghcr.io/groundsada/rtmon-archify:archify-dev
          imagePullPolicy: Always
          env:
            # Explicit rather than relying on the image default, so the port
            # is pinned by the manifest that also declares containerPort and
            # the Service. 8081 because RTMon's own results API (RTMon-Http,
            # http_api_port) defaults to 8080 and a sidecar in the same pod
            # would collide with it.
            - name: ARCHIFY_PORT
              value: "8081"
            - name: ARCHIFY_DIAGRAM_DIR
              value: /srv/diagrams
            - name: ARCHIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rtmon-archify-auth
                  key: archify-token
          ports:
            - name: http
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            # Without this the PVC is declared and never used: the renderer
            # writes into the image's own directory, which is root-owned and
            # unwritable by the node user, and nothing survives a restart.
            - name: diagrams
              mountPath: /srv/diagrams
      volumes:
        - name: diagrams
          persistentVolumeClaim:
            claimName: pvc-rtmon-archify-sidecar
